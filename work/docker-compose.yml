services:
  # MySQL 8.0 服务
  mysql:
    image: mysql:8.0
    container_name: mysql80
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: testdb
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./logs/mysql:/var/log/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - dev-network

  # Redis 7.2.5 服务
  redis:
    image: redis:7.2.5
    container_name: redis725
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./logs/redis:/var/log/redis
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - dev-network

  # PHP 8.1.33 + Nginx 服务 (Web服务1)
  php-web1:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php-web1
    restart: always
    ports:
      - "48080:80"
    volumes:
      - ./www/web1:/var/www/html
      - ./config/nginx/web1.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx/web1:/var/log/nginx
      - ./config/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - dev-network

  # PHP 8.1.33 + Nginx 服务 (Web服务2)
  php-web2:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php-web2
    restart: always
    ports:
      - "48081:80"
    volumes:
      - ./www/web2:/var/www/html
      - ./config/nginx/web2.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx/web2:/var/log/nginx
      - ./config/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - dev-network

  # PHP 8.1.33 + Nginx 服务 (Web服务3)
  php-web3:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: php-web3
    restart: always
    ports:
      - "48082:80"
    volumes:
      - ./www/web3:/var/www/html
      - ./config/nginx/web3.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx/web3:/var/log/nginx
      - ./config/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - dev-network

  # Java JDK 17 服务
  java-app:
    build:
      context: ./docker/java
      dockerfile: Dockerfile
    container_name: java-app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./www/java:/app
      - ./logs/java:/var/log/java
    depends_on:
      - mysql
      - redis
    networks:
      - dev-network
    command: tail -f /dev/null

networks:
  dev-network:
    driver: bridge
